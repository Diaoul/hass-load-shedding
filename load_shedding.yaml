blueprint:
  name: ⚡ Load Shedding
  description: |
    Proactive load management to prevent exceeding power capacity limits.

    Supports dynamic capacity via sensor input (e.g. solar + grid limit, time-of-use).

    **Features:**
    - ⚡ Real-time power monitoring
    - 🎯 Order-based priority: the order of your list
    - 🔄 Budget-aware restoration
    - 🛡️ Configurable safety margins
    - 🚫 Anti-flapping protection
    - 📝 Structured load configuration

    **How it works:**
    1. Monitors total power consumption (e.g. from a Linky meter)
    2. Sheds loads when consumption passes the safety margin (default: 90% of capacity)
    3. Restores loads, highest priority first, once consumption drops below the
       restoration margin (default: 80%), filling the budget up to the safety
       margin so an overprovisioned house actually gets its loads back
    4. Prevents rapid cycling with a minimum shed duration (default: 5 min) and
       the gap between the two margins

    Every run recomputes what should be shed from current entity states, so a
    missed run is harmless: the next one starts from scratch.

    **Configuration:** one datetime helper for the automation, plus one
    input_boolean per load, used to disable it.

    **Requirements:** Home Assistant 2025.7.0 or later
  source_url: https://github.com/Diaoul/hass-load-shedding/blob/main/load_shedding.yaml
  homeassistant:
    min_version: "2025.7.0"
  domain: automation
  input:
    power_monitoring:
      name: Power Monitoring
      icon: mdi:flash
      collapsed: false
      input:
        total_power_sensor:
          name: 📊 Total Power Consumption Sensor
          description: |
            Sensor measuring total household power consumption (e.g. Linky meter, whole-home energy monitor).

            If your meter reports VA (apparent power) instead of W (real power), create a template sensor to convert using your power factor.

            While this sensor is unavailable the automation does nothing: it will
            not shed and will not restore.
          selector:
            entity:
              filter:
                - domain: sensor
                  device_class: power
              multiple: false

        max_power_sensor:
          name: ⚡ Max Power Capacity Sensor
          description: |
            Sensor or helper reporting maximum power capacity in Watts.

            Can be static (input_number helper) or dynamic (template sensor).

            **Static capacity:**
            - Create input_number helper with fixed value (e.g. 9000)

            **Dynamic capacity examples:**
            - Solar + Grid: Template sensor with `9000 + solar_power`
            - Time-of-use: Different limits by hour (off-peak vs peak)
            - Battery state: Higher limit when battery charged

            A capacity of 0, or an unavailable entity, stops the run.
          selector:
            entity:
              filter:
                - domain: sensor
                - domain: input_number
              multiple: false

        safety_margin_percent:
          name: 🛡️ Safety Margin Percentage
          description: |
            Start shedding loads when consumption reaches this percentage of max capacity.
            Example: 90% means shed at 8100W if max is 9000W.
            Higher values = more proactive shedding.
          default: 90
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

        restoration_margin_percent:
          name: 🔄 Restoration Margin Percentage
          description: |
            Only start restoring loads when consumption is below this percentage.
            Must be lower than the safety margin; the gap is what prevents flapping.
            Example: 80% means restoration may start below 7200W if max is 9000W.

            This decides *when* restoration starts, not how much comes back: loads
            are then released until their rated powers reach the safety margin, so
            the headroom between the two margins is usable rather than reserved.
          default: 80
          selector:
            number:
              min: 50
              max: 100
              step: 1
              unit_of_measurement: "%"
              mode: slider

    load_configuration:
      name: Load Configuration
      icon: mdi:lightning-bolt-circle
      collapsed: false
      input:
        managed_loads:
          name: 🎯 Managed Loads
          description: |
            Configure each load you want to manage.
            Click "Add Item" to add a new load.

            **Priority by order:** top = highest priority (shed last), bottom = lowest (shed first).

            **Fields:**
            - **Detection Entity** (required): climate or switch telling whether the load is currently drawing power
              - Climate: ON when `hvac_action` is `heating`/`cooling`, or by temperature delta if `sensor_based` is selected
              - Switch: ON when the state is `on`
            - **Off Override** (required): input_boolean that disables the load
              - ON = load shed, OFF = load free to run
              - It holds the shed state, so nothing is remembered between runs
            - **Maximum Power** (required): rated consumption in Watts. Sets the restoration budget, and stands in for a missing power sensor when shedding
            - **Power Sensor** (optional): real consumption, used instead of the rated value when deciding how much shedding is needed
            - **Climate Detection Method** (optional): defaults to `hvac_action`

            A load missing a required field stops the whole automation: with a
            broken entry the shed maths is wrong for every load, so it refuses to
            act rather than shed a partial list.
          default: []
          selector:
            object:
              multiple: true
              label_field: detection_entity
              fields:
                detection_entity:
                  label: Detection Entity
                  selector:
                    entity:
                      filter:
                        - domain: climate
                        - domain: switch
                      multiple: false

                off_override:
                  label: Off Override
                  selector:
                    entity:
                      filter:
                        - domain: input_boolean
                      multiple: false

                max_power:
                  label: Maximum Power (Watts)
                  selector:
                    number:
                      min: 1
                      max: 50000
                      step: 1
                      unit_of_measurement: "W"
                      mode: box

                power_sensor:
                  label: Power Sensor (Optional)
                  selector:
                    entity:
                      filter:
                        - domain: sensor
                          device_class: power
                      multiple: false

                climate_detection:
                  label: Climate Detection Method (Optional)
                  selector:
                    select:
                      options:
                        - label: hvac_action (accurate, recommended)
                          value: hvac_action
                        - label: sensor_based (fallback)
                          value: sensor_based

    timing_and_stability:
      name: Timing & Stability
      icon: mdi:clock-outline
      collapsed: true
      input:
        minimum_shed_duration:
          name: ⏱️ Minimum Shed Duration
          description: |
            Nothing is restored until this long has passed since the last shed
            or restore (prevents rapid cycling).
          default:
            hours: 0
            minutes: 5
            seconds: 0
          selector:
            duration:
              enable_day: false

    tracking_helpers:
      name: Tracking Helpers (Required)
      icon: mdi:database
      collapsed: true
      input:
        last_action_datetime:
          name: ⏰ Last Action DateTime Tracker
          description: |
            `required`

            Date and time helper stamped every time a load is shed or restored.
            It is what enforces the minimum shed duration.

            **Create it with both date and time enabled.** With only one of them
            it reports a time of day rather than a date, which would disable the
            minimum shed duration, so restoration refuses to run; shedding still
            works. Its initial value does not matter, and a missing helper simply
            reads as "long ago".

            Create helper [here](https://my.home-assistant.io/redirect/helpers/).
          selector:
            entity:
              filter:
                - domain: input_datetime
              multiple: false

# Every input a template reads has to be mapped here first: !input is not
# visible to templates.
variables:
  total_power_sensor: !input total_power_sensor
  max_power_sensor: !input max_power_sensor
  safety_margin: !input safety_margin_percent
  restoration_margin: !input restoration_margin_percent
  managed_loads: !input managed_loads
  minimum_shed_duration: !input minimum_shed_duration
  last_action_datetime: !input last_action_datetime

  max_power: "{{ states(max_power_sensor) | float(0) }}"
  current_power: "{{ states(total_power_sensor) | float(0) }}"
  shedding_threshold: "{{ (max_power * safety_margin / 100) | round(0) }}"
  restoration_threshold: "{{ (max_power * restoration_margin / 100) | round(0) }}"

  # Drops any entry missing a required field. The guard compares this length
  # against managed_loads, so a dropped entry stops the run rather than vanishing.
  loads: >-
    {% set ns = namespace(items=[]) %}
    {% for load in managed_loads %}
      {% set detection = load.get('detection_entity') %}
      {% set control = load.get('off_override') %}
      {% set rated = load.get('max_power') | float(0) %}
      {% if detection and control and rated > 0 %}
        {% set ns.items = ns.items + [{
          'index': loop.index0,
          'detection': detection,
          'control': control,
          'rated': rated,
          'sensor': load.get('power_sensor') or '',
          'method': load.get('climate_detection') or 'hvac_action'
        }] %}
      {% endif %}
    {% endfor %}
    {{ ns.items }}

  detection_entities: "{{ managed_loads | map(attribute='detection_entity', default='') | list }}"

  # What every load is doing right now. Both plans are built from this.
  load_status: >-
    {% set ns = namespace(items=[]) %}
    {% for load in loads %}
      {% set on = namespace(value=false) %}
      {% if load.detection.split('.')[0] == 'climate' %}
        {% if load.method == 'sensor_based' %}
          {% set mode = states(load.detection) %}
          {% set current = state_attr(load.detection, 'current_temperature') | float(0) %}
          {% set target = state_attr(load.detection, 'temperature') | float(0) %}
          {% if mode == 'heat' %}
            {% set on.value = current < target %}
          {% elif mode == 'cool' %}
            {% set on.value = current > target %}
          {% elif mode in ['heat_cool', 'auto'] %}
            {% set on.value = current != target %}
          {% endif %}
        {% else %}
          {% set on.value = state_attr(load.detection, 'hvac_action') in ['heating', 'cooling'] %}
        {% endif %}
      {% else %}
        {% set on.value = is_state(load.detection, 'on') %}
      {% endif %}

      {# Rated power is a guess, so prefer the sensor when it reads at all.
         A negative figure is export, not consumption. #}
      {% set measured = states(load.sensor) | float(-1) if load.sensor and has_value(load.sensor) else -1 %}

      {% set ns.items = ns.items + [{
        'index': load.index,
        'control': load.control,
        'rated': load.rated,
        'power': measured if measured >= 0 else load.rated,
        'on': on.value,
        'shed': is_state(load.control, 'on'),
        'available': has_value(load.control)
      }] %}
    {% endfor %}
    {{ ns.items }}

  # Idle loads are shed too: one left free to start would blow the budget the
  # moment it does. They cannot count against the deficit though, or shedding an
  # idle load would look like it freed power that was never being drawn.
  shed_plan: >-
    {% set ns = namespace(deficit=current_power - shedding_threshold, picked=[]) %}
    {% for load in load_status | rejectattr('shed') | selectattr('available')
                               | sort(attribute='index', reverse=true) %}
      {% if ns.deficit > 0 %}
        {% set ns.picked = ns.picked + [load.control] %}
        {% if load.on %}
          {% set ns.deficit = ns.deficit - load.power %}
        {% endif %}
      {% endif %}
    {% endfor %}
    {{ ns.picked }}

  # The budget runs to the *shedding* threshold, not the restoration one: that
  # margin only decides when it is calm enough to start, and that gate is in the
  # conditions below. Using it for both left any load rated between the two
  # margins permanently shed, however empty the house was.
  restore_plan: >-
    {% set ns = namespace(budget=shedding_threshold - current_power, picked=[]) %}
    {% for load in load_status | selectattr('shed') | selectattr('available')
                               | sort(attribute='index') %}
      {# Still drawing means already counted in current_power, so releasing it
         costs nothing. Charging it rated power would strand the override for as
         long as the load kept running. #}
      {% set cost = 0 if load.on else load.rated %}
      {% if cost <= ns.budget %}
        {% set ns.picked = ns.picked + [load.control] %}
        {% set ns.budget = ns.budget - cost %}
      {% endif %}
    {% endfor %}
    {{ ns.picked }}

  # The timestamp attribute avoids parsing the state and guessing its timezone.
  # A missing helper reads as "long ago" rather than raising.
  seconds_since_last_action: >-
    {{ (now().timestamp() - (state_attr(last_action_datetime, 'timestamp') | float(0))) | int }}

  # A helper without both date and time reports `timestamp` as seconds since
  # midnight, which reads as "ages ago" every run and silently disables the
  # minimum shed duration. An absent attribute means the helper is gone, not
  # misshapen, so it does not count as wrong here.
  tracker_usable: >-
    {{ state_attr(last_action_datetime, 'has_date') != false
       and state_attr(last_action_datetime, 'has_time') != false }}

# Event-driven only: there is no periodic tick, so an override flipped by hand
# stays flipped until one of these fires.
triggers:
  - trigger: homeassistant
    event: start
    id: ha_start

  # not_to is what makes these ignore attribute-only updates: a state trigger
  # with no to/from/not_to/not_from matches every change, attributes included.
  - trigger: state
    entity_id: !input total_power_sensor
    not_to: [unavailable, unknown]
    id: power_changed

  - trigger: state
    entity_id: !input max_power_sensor
    not_to: [unavailable, unknown]
    id: capacity_changed

actions:
  # Guard the run here rather than in conditions: a manual "Run actions" skips
  # top-level conditions entirely.
  - alias: Stop unless the configuration and the sensors can be trusted
    condition: >-
      {{ has_value(total_power_sensor)
        and has_value(max_power_sensor)
        and max_power > 0
        and restoration_margin < safety_margin
        and managed_loads | length > 0
        and loads | length == managed_loads | length
        and detection_entities | unique | list | length == detection_entities | length }}

  - choose:
      - alias: Over the safety margin, shed
        conditions:
          - "{{ current_power > shedding_threshold and shed_plan | length > 0 }}"
        sequence:
          # One call per entity: continue_on_error stops a failure from skipping
          # the steps after it, but cannot rescue the rest of a grouped call.
          - alias: Shed every planned load
            repeat:
              for_each: "{{ shed_plan }}"
              sequence:
                - action: homeassistant.turn_on
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true

          - alias: Stamp the last-action tracker
            action: input_datetime.set_datetime
            target:
              entity_id: "{{ last_action_datetime }}"
            data:
              timestamp: "{{ now().timestamp() }}"

      - alias: Under the restoration margin, restore
        conditions:
          - "{{ current_power < restoration_threshold }}"
          - "{{ tracker_usable }}"
          - "{{ seconds_since_last_action >= timedelta(**minimum_shed_duration).total_seconds() }}"
          - "{{ restore_plan | length > 0 }}"
        sequence:
          - alias: Restore every planned load
            repeat:
              for_each: "{{ restore_plan }}"
              sequence:
                - action: homeassistant.turn_off
                  target:
                    entity_id: "{{ repeat.item }}"
                  continue_on_error: true

          - alias: Stamp the last-action tracker
            action: input_datetime.set_datetime
            target:
              entity_id: "{{ last_action_datetime }}"
            data:
              timestamp: "{{ now().timestamp() }}"

# An overlapping run is dropped and logged as "Already running". The next state
# change recomputes everything anyway, and max_exceeded is left loud on purpose
# so the drops stay visible.
mode: single
